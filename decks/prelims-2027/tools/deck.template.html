<meta charset="utf-8">
<title>Prelims 2027 Deck</title>
<style>
/* Layout: one fixed 1920x1080 stage (PPT geometry, 1pt = 2px) scaled to the window; camera layer inside each slide */
@font-face{font-family:"Nimbus Sans L";font-weight:700;font-style:normal;src:url(data:font/otf;base64,{{FONT_B}}) format("opentype")}
@font-face{font-family:"Nimbus Sans L";font-weight:700;font-style:italic;src:url(data:font/otf;base64,{{FONT_BI}}) format("opentype")}
:root{
  --ink:#0A0A0A; --cream:#F5EDE4; --bar:#F3EBE2; --gold:#D2A448; --blush:#F0B4A6;
  --red:#D9553F; --brick:#9B2B23; --oxblood:#79231E; --ash:#57504B; --amber:#EDB92A;
  --font:"Nimbus Sans L","Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#000;color:var(--cream);font-family:var(--font);font-weight:700;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
#viewport{position:fixed;inset:0;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:var(--ink)}
.slide.on{visibility:visible}
.layer{position:absolute;inset:0}
.bgwrap{transition:transform 1.9s cubic-bezier(.65,0,.25,1);transform-origin:50% 52%}
.bgwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{background:#000;opacity:0;transition:opacity 1.6s cubic-bezier(.4,0,.2,1);pointer-events:none}
.cam{transform-origin:0 0;transition:transform 1.9s cubic-bezier(.65,0,.25,1);will-change:transform}
.chrome{pointer-events:none;transition:opacity 1.2s cubic-bezier(.4,0,.2,1)}
.it{position:absolute}
.txt{display:flex;flex-direction:column}
.txt p{margin:0;white-space:pre-wrap}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .14em .12em 0;margin:0 -.14em -.12em 0}
.w>span{display:inline-block}
.card{-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 30px 80px -30px rgba(0,0,0,.6)}
.paper{background:#fff;cursor:zoom-in}
.paper img{position:absolute;display:block}
.chart{cursor:zoom-in}
.chart .sw{position:absolute;inset:0;transition:opacity 1.1s cubic-bezier(.4,0,.2,1)}
.chart img{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile{display:flex;align-items:center;justify-content:center}
.zoomed .paper,.zoomed .chart{cursor:zoom-out}

/* native charts from slides 01 and 04, drawn in their source PNG's pixel space */
.cd{position:absolute;left:0;top:0;width:2400px;height:520px;transform-origin:0 0}
.cd .m{position:absolute;top:66px;font-size:46px;color:var(--cream);opacity:.92}
.cd .tk{position:absolute;top:120px;width:3px;height:40px;background:var(--cream);opacity:.85;transform-origin:50% 100%}
.cd .c{position:absolute;top:170px;width:66px;height:160px;border-radius:8px;transform-origin:50% 100%}
.cd .lab{position:absolute;top:392px;font-size:48px;color:var(--cream);white-space:nowrap;font-variant-numeric:tabular-nums}
.ch{position:absolute;left:0;top:0;width:2300px;height:980px;transform-origin:0 0}
.ch .g{position:absolute;left:120px;width:2120px;height:2px;background:#3d3a38;transform-origin:0 50%}
.ch .base{background:rgba(242,232,222,.55)}
.ch .ax{position:absolute;left:0;width:101px;text-align:right;font-size:31px;color:var(--cream);opacity:.85}
.ch .b{position:absolute;width:227px;border-radius:8px 8px 2px 2px;background:var(--bar);transform-origin:50% 100%}
.ch .v{position:absolute;width:345px;text-align:center;font-size:57px;color:var(--cream);font-variant-numeric:tabular-nums;white-space:nowrap}
.ch .y{position:absolute;top:860px;width:345px;text-align:center;font-size:40px;color:var(--cream);opacity:.9}
.ch .b.hot{background:var(--red)}
.ch .v.hot{color:var(--red);font-size:60px}
.ch .bracket{position:absolute;left:2233px;top:276px;width:7px;height:299px;background:var(--amber);border-radius:3px;transform-origin:50% 0}
.ch .note{position:absolute;right:86px;top:198px;font-size:41px;color:var(--amber);white-space:nowrap}

/* hover-only controls, so a still screen share stays clean */
#nav{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .4s}
body.mouse #nav{opacity:1}
#nav button{all:unset;cursor:pointer;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;font:700 20px/1 var(--font);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#nav button:hover{background:rgba(255,255,255,.22)}
#pos{font:700 14px/1 var(--font);color:rgba(255,255,255,.75);padding:0 8px;font-variant-numeric:tabular-nums}
#jump{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font:700 22px/1 var(--font);color:#fff;background:rgba(0,0,0,.7);padding:10px 16px;border-radius:10px}
</style>

<div id="viewport"><div id="stage"></div></div>
<div id="nav"><span id="pos"></span><button id="prev" aria-label="Back">‹</button><button id="replay" aria-label="Replay this slide">↺</button><button id="next" aria-label="Next">›</button></div>
<div id="jump" hidden></div>

<script>
const MEDIA = {{MEDIA_JSON}};
const DECK = {{DECK_JSON}};
</script>
<script>
(() => {
/* ---------- timing ---------- */
const T = 1.35;                                   // everything ~35% slower than the demo
const OUT = 'cubic-bezier(.16,1,.3,1)', SPRING = 'cubic-bezier(.22,1.18,.36,1)', SOFT = 'cubic-bezier(.4,0,.2,1)';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const $ = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };
const px = v => v + 'px';
function place(el, b) {
  Object.assign(el.style, {left: px(b.x), top: px(b.y), width: px(b.w), height: px(b.h)});
  if (b.rot) el.style.transform = `rotate(${b.rot}deg)`;
}

/* ---------- animation bookkeeping: INSTANT builds a state without motion ---------- */
let INSTANT = false, ACTIVE = null;
try { CSS.registerProperty({name:'--sweep', syntax:'<angle>', inherits:false, initialValue:'0deg'}); } catch (e) {}
function A(el, kf, o) {
  if (!el) return null;
  o = Object.assign({fill: 'both', easing: OUT}, o);
  o.duration = (o.duration || 1000) * T; o.delay = (o.delay || 0) * T;
  const a = el.animate(kf, o);
  const owner = ACTIVE;
  if (owner) owner.live.push(a);
  // once finished, bake the end state into the element and drop the animation (keeps long decks light)
  if (o.fill !== 'none') {
    const props = [...new Set(kf.flatMap(f => Object.keys(f)).filter(k => k !== 'offset' && k !== 'easing'))];
    a.onfinish = () => {
      if (a.playState !== 'finished') return;
      el._orig = el._orig || {};
      props.forEach(k => { if (!(k in el._orig)) el._orig[k] = k.startsWith('--') ? el.style.getPropertyValue(k) : el.style[k]; });
      try { a.commitStyles(); } catch (e) {}
      a.cancel();
      if (owner) owner.baked.add(el);
    };
  }
  if (INSTANT || reduce) a.finish();
  return a;
}
function show(el) { el.style.visibility = 'visible'; }
function count(el, to, delay, dur) {
  const m = el.dataset.final.match(/^(\+?)([\d,]+)(.*)$/);
  const pre = m[1], target = +m[2].replace(/,/g, ''), suf = m[3], comma = m[2].includes(',');
  const fmt = v => pre + (comma ? Math.round(v).toLocaleString('en-US') : Math.round(v)) + suf;
  if (INSTANT || reduce) { el.textContent = el.dataset.final; return; }
  const t0 = performance.now() + delay * T, token = el._tok = Symbol();
  el.textContent = fmt(0);
  const tick = now => {
    if (el._tok !== token) return;
    const p = Math.min(1, Math.max(0, (now - t0) / (dur * T)));
    el.textContent = p >= 1 ? el.dataset.final : fmt(target * (1 - Math.pow(1 - p, 4)));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---------- text ---------- */
function renderText(host, t, opts) {
  host.classList.add('txt');
  host.style.justifyContent = t.anchor === 'ctr' ? 'center' : 'flex-start';
  t.paras.forEach(p => {
    const el = $('p', null, host);
    el.style.textAlign = {l: 'left', r: 'right', ctr: 'center'}[p.algn] || 'left';
    const lh = 1.18 * (p.lnSpc || 1);
    el.style.lineHeight = lh;
    if (!p.runs.length) { el.style.height = px((p.endSz || 20) * lh); return; }
    p.runs.forEach(r => {
      const s = $('span', null, el);
      s.style.fontSize = px(r.sz);
      if (r.i) s.style.fontStyle = 'italic';
      if (r.spc) s.style.letterSpacing = px(r.spc);
      if (r.color) s.style.color = r.color.a < 1 ? `rgba(${parseInt(r.color.hex.slice(1,3),16)},${parseInt(r.color.hex.slice(3,5),16)},${parseInt(r.color.hex.slice(5,7),16)},${r.color.a})` : r.color.hex;
      if (opts.words) {
        r.t.split(/(\s+)/).forEach(w => {
          if (!w) return;
          if (/^\s+$/.test(w)) { s.appendChild(document.createTextNode(w)); return; }
          const m = $('span', 'w', s); $('span', null, m).textContent = w;
        });
      } else s.textContent = r.t;
      if (opts.count) { s.dataset.final = r.t; s.classList.add('cnt'); s.style.fontVariantNumeric = 'tabular-nums'; }
    });
  });
}

/* ---------- native charts (01 countdown, 04 cut-off) ---------- */
function buildCountdown(host) {
  const g = $('div', 'cd', host); g.style.transform = `scale(${host.clientWidth / 2400 || 0.4846})`;
  const months = [['OCT',25],['NOV',246],['DEC',563],['JAN',886],['FEB',1210],['MAR',1505],['APR',1836],['MAY',2154]];
  months.forEach(([t,x]) => { const k = $('div','tk',g); k.style.left = px(x); const m = $('div','m',g); m.style.left = px(x+8); m.textContent = t; });
  for (let i = 0; i < 32; i++) {
    const c = $('div','c',g); c.style.left = px(24 + i*73.74);
    c.style.background = i < 10 ? 'var(--brick)' : i < 16 ? 'var(--ash)' : i < 30 ? 'var(--oxblood)' : i === 30 ? 'var(--gold)' : 'var(--red)';
  }
  g.insertAdjacentHTML('beforeend', `<div class="lab cdL" style="left:19px">9 OCT 2026</div>
    <div class="lab cdM" style="left:0;width:2400px;text-align:center"><span class="cnt wk" data-final="32">32</span> weeks &nbsp;&middot;&nbsp; <span class="cnt dy" data-final="226">226</span> days</div>
    <div class="lab cdR" style="right:24px;color:#F0BE32">23 MAY 2027</div>`);
  return g;
}
function playCountdown(g, phase) {
  const q = s => g.querySelector(s), qa = s => [...g.querySelectorAll(s)];
  qa('.tk').forEach((el,i) => A(el, [{transform:'scaleY(0)'},{transform:'none'}], {duration:700, delay:200 + i*110}));
  qa('.m').forEach((el,i) => A(el, [{opacity:0, transform:'translateY(12px)'},{opacity:.92, transform:'none'}], {duration:800, delay:200 + i*110}));
  const cells = qa('.c');
  cells.forEach((el,i) => A(el, [{transform:'scaleY(0)', opacity:0},{transform:'none', opacity:1}], {duration:1000, delay:450 + i*45, easing:SPRING}));
  const last = 450 + 31*45 + 600;
  if (!INSTANT) {
    A(cells[30], [{boxShadow:'0 0 0 0 rgba(210,164,72,0)'},{boxShadow:'0 0 34px 8px rgba(210,164,72,.55)'},{boxShadow:'0 0 0 0 rgba(210,164,72,0)'}], {duration:1600, delay:last, easing:SOFT, fill:'none'});
    A(cells[31], [{boxShadow:'0 0 0 0 rgba(217,85,63,0)', transform:'none'},{boxShadow:'0 0 48px 12px rgba(217,85,63,.6)', transform:'scale(1.06)'},{boxShadow:'0 0 0 0 rgba(217,85,63,0)', transform:'none'}], {duration:1800, delay:last+300, iterations:2, easing:SOFT, fill:'none'});
  }
  A(q('.cdL'), [{opacity:0, transform:'translateX(-36px)'},{opacity:1, transform:'none'}], {duration:1100, delay:700});
  A(q('.cdR'), [{opacity:0, transform:'translateX(36px)'},{opacity:1, transform:'none'}], {duration:1100, delay:last});
  A(q('.cdM'), [{opacity:0},{opacity:1}], {duration:900, delay:700});
  count(q('.wk'), 32, 700, 1700); count(q('.dy'), 226, 700, 1700);
}
function buildCutoff(host) {
  const g = $('div', 'ch', host); g.style.transform = `scale(${host.clientWidth / 2300 || 0.5657})`;
  const Y = v => 842 - (v - 60) * 17.25;
  [100,90,80,70].forEach(v => g.insertAdjacentHTML('beforeend', `<div class="g" style="top:${Y(v)-1}px"></div><div class="ax" style="top:${Y(v)-21}px">${v}</div>`));
  g.insertAdjacentHTML('beforeend', `<div class="g base" style="top:841px"></div>`);
  [[2021,87.54],[2022,88.22],[2023,75.41],[2024,87.98],[2025,92.66],[2026,79,'~']].forEach(([yr,v,ap],i) => {
    const cx = 298 + i*353, hot = !!ap, label = (ap||'') + (hot ? v : v.toFixed(2));
    g.insertAdjacentHTML('beforeend', `<div class="b${hot?' hot':''}" style="left:${cx-113.5}px;top:${Y(v)}px;height:${842-Y(v)}px"></div>
      <div class="v${hot?' hot':''}" data-v="${v}" data-final="${label}" style="left:${cx-172}px;top:${Y(v)-76}px">${label}</div>
      <div class="y" style="left:${cx-172}px">${yr}</div>`);
  });
  g.insertAdjacentHTML('beforeend', `<div class="bracket"></div><div class="note">17 marks apart</div>`);
  return g;
}
function playCutoff(g, phase) {
  const q = s => g.querySelector(s), qa = s => [...g.querySelectorAll(s)];
  if (phase === 'main') {
    qa('.bracket,.note').forEach(e => e.style.visibility = 'hidden');
    qa('.g').forEach((el,i) => A(el, [{transform:'scaleX(0)'},{transform:'none'}], {duration:1300, delay:i*80}));
    qa('.ax').forEach((el,i) => A(el, [{opacity:0},{opacity:.85}], {duration:800, delay:100 + i*80}));
    const bars = qa('.b'), vals = qa('.v'), yrs = qa('.y');
    bars.forEach((b,i) => {
      const d = i < 5 ? 450 + i*200 : 1900;
      A(b, [{transform:'scaleY(0)'},{transform:'none'}], {duration:1300, delay:d, easing:SPRING});
      A(yrs[i], [{opacity:0, transform:'translateY(14px)'},{opacity:.9, transform:'none'}], {duration:800, delay:d});
      const v = vals[i], top = parseFloat(v.style.top);
      A(v, [{opacity:0, transform:`translateY(${842 - top - 70}px)`},{opacity:1, transform:'none'}], {duration:1300, delay:d, easing:SPRING});
      const target = +v.dataset.v, ap = v.dataset.final.startsWith('~');
      if (INSTANT || reduce) v.textContent = v.dataset.final;
      else { const t0 = performance.now() + d*T, tok = v._tok = Symbol();
        const tick = now => { if (v._tok !== tok) return; const p = Math.min(1, Math.max(0,(now-t0)/(1300*T))), e = 1-Math.pow(1-p,4);
          const val = 60 + (target-60)*e; v.textContent = p >= 1 ? v.dataset.final : (ap ? '~' + Math.round(val) : val.toFixed(2));
          if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
    });
  } else {
    const bars = qa('.b'), vals = qa('.v');
    [0,1,3,5].forEach(i => [bars[i], vals[i]].forEach(el => { if (!INSTANT) A(el, [{opacity:1},{opacity:.28, offset:.2},{opacity:.28, offset:.8},{opacity:1}], {duration:2800, easing:SOFT, fill:'none'}); }));
    const br = q('.bracket'), nt = q('.note'); show(br); show(nt);
    A(br, [{transform:'scaleY(0)'},{transform:'none'}], {duration:1200, delay:300});
    A(nt, [{opacity:0, transform:'translateY(14px)', filter:'blur(4px)'},{opacity:1, transform:'none', filter:'blur(0)'}], {duration:1000, delay:800});
  }
}

/* ---------- build every slide ---------- */
const slides = DECK.map(S => {
  const sec = $('section', 'slide', stage);
  const bgw = $('div', 'layer bgwrap', sec), scrim = $('div', 'layer scrim', sec), cam = $('div', 'layer cam', sec), chrome = $('div', 'layer chrome', sec);
  const byId = {};
  S.items.forEach(it => {
    let el;
    const parent = ['band','kicker','footer','num'].includes(it.role) ? chrome : cam;
    switch (it.role) {
      case 'bg': el = $('img', null, bgw); el.src = MEDIA[it.src]; el.alt = ''; break;
      case 'band': case 'shape': case 'rule':
        el = $('div', 'it', parent); place(el, it.box); el.style.background = it.fill || 'transparent'; break;
      case 'card':
        el = $('div', 'it card', parent); place(el, it.box); el.style.background = it.fill; el.style.borderRadius = px(it.radius); break;
      case 'tile':
        el = $('div', 'it tile', parent); place(el, it.box); el.style.background = it.fill; el.style.borderRadius = px(it.radius);
        const tt = $('div', null, el); tt.style.width = '100%'; renderText(tt, it.text, {}); break;
      case 'paper': {
        el = $('div', 'it paper', parent); place(el, it.box);
        if (it.shadow) el.style.boxShadow = `0 ${it.shadow.dist}px ${it.shadow.blur}px rgba(0,0,0,${it.shadow.a})`;
        const im = $('img', null, el); im.src = MEDIA[it.src]; im.alt = ''; place(im, it.pic); el._img = im;
        el.dataset.zoom = 1; break;
      }
      case 'pic':
        el = $('img', 'it', parent); el.src = MEDIA[it.src]; el.alt = ''; place(el, it.box); el.dataset.zoom = 1; break;
      case 'chart': {
        el = $('div', 'it chart', parent); place(el, it.box); el.dataset.zoom = 1;
        const sx = it.box.w / it.nat[0], sy = it.box.h / it.nat[1];
        const parts = it.parts.map((p, k) => {
          const sw = $('div', 'sw', el), im = $('img', null, sw); im.src = MEDIA[it.src]; im.alt = '';
          const [x, y, w, h] = p.r, W = it.box.w, H = it.box.h;
          const r = {t: y*sy, l: x*sx, b: Math.max(0, H - (y+h)*sy), rr: Math.max(0, W - (x+w)*sx), w: w*sx, h: h*sy};
          if (!it.overlay) im.style.clipPath = `inset(${r.t}px ${r.rr}px ${r.b}px ${r.l}px)`;
          im.style.transformOrigin = `${r.l + r.w/2}px ${r.t + r.h/2}px`;
          return {p, sw, im, r, k};
        });
        let base = null;
        if (!it.overlay) {
          const bsw = $('div', 'sw', el); el.insertBefore(bsw, el.firstChild);
          const bim = $('img', null, bsw); bim.src = MEDIA[it.src]; bim.alt = '';
          let d = `M0 0H${it.box.w}V${it.box.h}H0Z`;
          parts.forEach(({r}) => d += `M${r.l} ${r.t}h${r.w}v${r.h}h${-r.w}Z`);
          bim.style.clipPath = `path(evenodd, "${d}")`;
          base = bsw;
        }
        el._parts = parts; el._base = base; el._it = it;
        break;
      }
      case 'native':
        el = $('div', 'it', parent); place(el, it.box); el.dataset.zoom = 1;
        el._g = it.kind === 'countdown' ? buildCountdown(el) : buildCutoff(el); el._kind = it.kind; break;
      default: {   // text, kicker, footer, num
        el = $('div', 'it', parent); place(el, it.box);
        renderText(el, it.text, {words: it.title, count: it.count});
      }
    }
    el._it = el._it || it; it.el = el; byId[it.id] = it;
  });
  return {S, sec, bgw, scrim, cam, chrome, byId, live: [], baked: new Set()};
});

/* ---------- reveal animations by role ---------- */
function revealItem(it, delay) {
  const el = it.el; show(el);
  switch (it.role) {
    case 'card': A(el, [{opacity:0, transform:'translateY(30px) scale(.985)'},{opacity:1, transform:'none'}], {duration:1300, delay}); break;
    case 'paper': {
      const rot = it.box.rot || 0;
      if (it.fx === 'paperwipe') {
        A(el, [{opacity:0, transform:`translateY(40px) rotate(${rot}deg) scale(.97)`},{opacity:1, transform:`rotate(${rot}deg)`}], {duration:1200, delay});
        A(el._img, [{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}], {duration:2600, delay: delay + 500, easing:'cubic-bezier(.45,0,.2,1)'});
      } else {
        A(el, [{opacity:0, transform:`translateY(90px) rotate(${rot + (rot >= 0 ? 6 : -6)}deg) scale(.92)`, filter:'blur(6px)'},
               {opacity:1, transform:`rotate(${rot}deg)`, filter:'blur(0)'}], {duration:1700, delay});
      }
      break;
    }
    case 'tile': A(el, [{opacity:0, transform:'translateY(24px) scale(.7)'},{opacity:1, transform:'none'}], {duration:1000, delay, easing:SPRING}); break;
    case 'rule': el.style.transformOrigin = '0 50%'; A(el, [{transform:'scaleX(0)'},{transform:'none'}], {duration:1300, delay}); break;
    case 'chart': {
      if (el._base) revealBase(el, delay);
      revealParts(el, el._parts.map(p => p.p.name), delay + 300); break;
    }
    case 'native':
      if (it.kind === 'countdown') playCountdown(el._g, 'main'); else playCutoff(el._g, 'main');
      // the native chart animates its own children; offset them by delay
      break;
    case 'pic': A(el, [{opacity:0, transform:'translateY(30px)'},{opacity:1, transform:'none'}], {duration:1300, delay}); break;
    default: {
      if (it.title) {
        [...el.querySelectorAll('.w>span')].forEach((w,i) => A(w, [{transform:'translateY(108%)'},{transform:'none'}], {duration:1300, delay: delay + i*120}));
      } else {
        A(el, [{opacity:0, transform:'translateY(22px)', filter:'blur(6px)'},{opacity:1, transform:'none', filter:'blur(0)'}], {duration:1300, delay});
        el.querySelectorAll('.cnt').forEach(c => count(c, 0, delay, 1900));
      }
    }
  }
}
function revealBase(el, delay) {
  if (el._baseShown) return; el._baseShown = true;
  show(el); show(el._base);

}
function revealParts(el, names, delay) {

  const it = el._it, gs = it.gs == null ? 160 : it.gs;
  const groups = [];
  const todo = el._parts.filter(P => names.includes(P.p.name));
  todo.forEach(P => { const g = P.p.g == null ? 'k' + P.k : P.p.g; if (!groups.includes(g)) groups.push(g); });

function focusParts(el, names) {

}

/* ---------- camera ---------- */
function camFor(sl, rect) {
  if (!rect) return null;
  const s = Math.min(1780 / rect.w, 960 / rect.h, 2.3);

}
function setCam(sl, c) {

  sl.bgw.style.transform = c ? `scale(${1 + (c.s - 1) * .18})` : 'none';
  sl.scrim.style.opacity = c ? .55 : 0;

}
function rectOf(it, frac) {
  const b = it.box, f = frac || [0, 0, 1, 1];
  return {x: b.x + f[0]*b.w, y: b.y + f[1]*b.h, w: f[2]*b.w, h: f[3]*b.h};

/* ---------- step engine ---------- */
let cur = -1, step = 0, manual = null;
function noTransitions(sl, fn) {
  const els = [sl.cam, sl.bgw, sl.scrim, sl.chrome, ...sl.sec.querySelectorAll('.sw')];
  els.forEach(e => e.style.transition = 'none');
  fn(); sl.sec.offsetHeight;
  els.forEach(e => e.style.transition = '');
}
function resetSlide(sl) {
  (sl.live || []).forEach(a => { a.onfinish = null; a.cancel(); }); sl.live = []; ACTIVE = sl;

  sl.baked = new Set();
  sl.S.items.forEach(it => {
    const el = it.el;
    el.querySelectorAll('.cnt').forEach(c => { c._tok = null; c.textContent = c.dataset.final; });
    el.querySelectorAll('.v').forEach(c => { c._tok = null; c.textContent = c.dataset.final; });
    if (it.role === 'chart') {
      el._baseShown = false;
      if (el._base) el._base.style.visibility = 'hidden';
      el._parts.forEach(P => { P.sw.style.visibility = 'hidden'; P.sw.style.opacity = 1; });
    }

}
function runIntro(sl) {
  ACTIVE = sl;
  const items = sl.S.items, byRole = r => items.filter(i => i.role === r);
  const bg = byRole('bg')[0];
  if (bg) A(bg.el, [{opacity:0, transform:'scale(1.14)'},{opacity:1, transform:'scale(1)'}], {duration:4200});
  byRole('band').forEach(b => A(b.el, [{transform: b.box.y < 10 ? 'translateY(-100%)' : 'translateY(100%)'},{transform:'none'}], {duration:1200, delay:150}));
  byRole('kicker').forEach(k => A(k.el, [{opacity:0, letterSpacing:'22px', filter:'blur(6px)'},{opacity:1, letterSpacing:'6px', filter:'blur(0)'}], {duration:1600, delay:350}));
  byRole('footer').concat(byRole('num')).forEach(k => A(k.el, [{opacity:0},{opacity:1}], {duration:1000, delay:900}));
  // everything else that belongs to step 0, in document order
  let d = 550;
  items.filter(i => i.step === 0 && !['bg','band','kicker','footer','num'].includes(i.role)).forEach(it => {
    revealItem(it, d);
    d += it.role === 'card' ? 200 : it.title ? 300 : 260;
  });
}
function runStep(sl, k) {
  ACTIVE = sl;
  const acts = sl.S.steps[k - 1] || [];

  acts.forEach(a => {
    if (a.t === 'zoom' || a.t === 'zoomr' || a.t === 'out') {

  acts.forEach(a => {
    const it = a.id != null ? sl.byId[a.id] : null;

    }
    if (a.t === 'reveal') { revealItem(it, d); d += it.role === 'tile' ? 90 : 330; }

function buildTo(i, k, animateLast) {

function go(i, opts = {}) {

/* ---------- presenter notes in a second window (press N) ---------- */
let notesWin = null;
function paintNotes() {
  const sl = slides[cur], d = notesWin.document;
  d.body.innerHTML = `<div style="font:700 15px/1.2 Helvetica,Arial;color:#D2A448;letter-spacing:2px">SLIDE ${String(sl.S.n).padStart(2,'0')} &middot; CLICK ${step} OF ${sl.S.steps.length}</div>
    <div style="font:400 22px/1.5 Helvetica,Arial;color:#F5EDE4;margin-top:16px;white-space:pre-wrap"></div>

function openNotes() {
  try {
    notesWin = window.open('', 'prelims-notes', 'width=560,height=700');
    if (!notesWin) return;
    notesWin.document.title = 'Speaker notes';
    notesWin.document.body.style.cssText = 'margin:0;padding:28px;background:#111';

/* ---------- input ---------- */
let jumpBuf = '', jumpTimer;
const jumpEl = document.getElementById('jump');
function onKey(e) {
  if (/^[0-9]$/.test(e.key)) {
    jumpBuf += e.key; jumpEl.hidden = false; jumpEl.textContent = 'Go to slide ' + jumpBuf;
    clearTimeout(jumpTimer); jumpTimer = setTimeout(() => { jumpBuf = ''; jumpEl.hidden = true; }, 2500); return;

  else if (e.key === 'End') go(slides.length - 1, {end: true});

  else if (e.key.toLowerCase() === 'f') { const d = document; (d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen()).catch(() => {}); }

}
addEventListener('keydown', onKey);
document.getElementById('viewport').addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  const sl = slides[cur];
  if (z) {
    const it = sl.S.items.find(i => i.el === z);
    if (it && z.style.visibility !== 'hidden') {
      if (manual === it) { manual = null; setCam(sl, sl.camState); }
      else { manual = it; setCam(sl, camFor(sl, rectOf(it))); }
      return;
    }
  }

document.getElementById('prev').onclick = e => { e.stopPropagation(); prev(); };
document.getElementById('replay').onclick = e => { e.stopPropagation(); go(cur); };
let idle;
addEventListener('mousemove', () => { document.body.classList.add('mouse'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.remove('mouse'), 1800); });

function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener('resize', fit); fit();

const m = location.hash.match(/^#s(\d+)$/);
const start = m ? Math.max(0, slides.findIndex(s => s.S.n === +m[1])) : 0;
document.fonts.ready.then(() => go(start));
window.__deck = {go, next, prev, get state() { return {slide: slides[cur].S.n, step, steps: slides[cur].S.steps.length}; }};
})();
