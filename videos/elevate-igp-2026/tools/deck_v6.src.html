<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELEVATE IGP 2026</title>
<style>
/* Layout: one 1920x1080 stage scaled to the window. Behind every slide sits one canvas of warm grainy dark,
   lit by soft stippled lights that each slide places, blooms and moves. Pictures are dark silhouettes
   standing in front of that light. Text sits on the dark part of the frame. */
@font-face { font-family:"Inter Tight"; font-weight:400; src:url(data:font/woff2;base64,{{FONT_400}}) format("woff2"); }
@font-face { font-family:"Inter Tight"; font-weight:500; src:url(data:font/woff2;base64,{{FONT_500}}) format("woff2"); }
@font-face { font-family:"Inter Tight"; font-weight:600; src:url(data:font/woff2;base64,{{FONT_600}}) format("woff2"); }
@font-face { font-family:"JetBrains Mono"; font-weight:400; src:url(data:font/woff2;base64,{{MONO_400}}) format("woff2"); }
@font-face { font-family:"JetBrains Mono"; font-weight:500; src:url(data:font/woff2;base64,{{MONO_500}}) format("woff2"); }
:root { --bg:#1a1614; --fg:#EFE7DE; --muted:#9C938A; --ink:#0d0a09; --amber:#EA9458; --red:#C7372B; color-scheme:dark; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:#0c0a09; overflow:hidden; }
body { color:var(--fg); font-family:"Inter Tight", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing:antialiased; user-select:none; }
#stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:center; overflow:hidden; background:var(--bg); }
#light { position:absolute; left:0; top:0; width:1920px; height:1080px; }
#grain { position:absolute; inset:0; width:1920px; height:1080px; pointer-events:none; z-index:50; mix-blend-mode:screen; opacity:.75; }
#logo { position:absolute; left:120px; top:54px; width:300px; color:var(--fg); z-index:40; opacity:.92; }
#logo svg { display:block; width:100%; height:auto; }
.slide { position:absolute; inset:0; visibility:hidden; }
.exit { position:absolute; inset:0; }
.abs { position:absolute; }
.mono { font-family:"JetBrains Mono", ui-monospace, monospace; }

/* silhouettes */
.sil { position:absolute; overflow:visible; }
.sil .ink { fill:var(--ink); }
.sil .amber { fill:var(--amber); }
.sil .cream { fill:var(--fg); }
.sil.rim { filter:drop-shadow(0 0 1.6px rgba(255,226,196,.38)); }

/* type */
.tx { position:absolute; left:120px; width:1100px; }
.w { display:inline-block; white-space:pre; }
.hero { font-size:150px; font-weight:600; letter-spacing:-0.035em; line-height:0.98; }
.stmt { font-size:100px; font-weight:600; letter-spacing:-0.03em; line-height:1.03; }
.ln { font-size:72px; font-weight:500; letter-spacing:-0.02em; line-height:1.1; }
.lines { display:flex; flex-direction:column; gap:30px; }
.q { font-size:58px; font-weight:400; letter-spacing:-0.012em; line-height:1.18; }
.lab { font-family:"JetBrains Mono", monospace; font-size:30px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); }
.cap { font-family:"JetBrains Mono", monospace; font-size:26px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
.cap b { color:var(--amber); font-weight:500; }
.stamp { font-family:"JetBrains Mono", monospace; font-size:28px; color:var(--muted); letter-spacing:.04em; }
.acc { color:var(--amber); }
.muted { color:var(--muted); }
.dark { color:#140f0c; }
.tag { display:inline-block; font-family:"JetBrains Mono", monospace; font-size:28px; font-weight:500; letter-spacing:.14em; color:#fff; background:var(--red); padding:6px 14px 5px; border-radius:4px; vertical-align:middle; }
.secno { position:absolute; left:112px; top:150px; font-size:300px; font-weight:500; letter-spacing:-0.05em; line-height:1; color:transparent; -webkit-text-stroke:2px rgba(239,231,222,.42); }
.num-big { font-size:340px; font-weight:600; letter-spacing:-0.05em; line-height:.9; font-variant-numeric:tabular-nums; }

/* typed lines */
.ty { position:relative; }
.ch { opacity:0; }
.cur { position:absolute; left:0; top:0.12em; width:5px; height:1em; opacity:0; }
.cur::after { content:""; position:absolute; inset:0; background:var(--amber); animation:blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }

/* form cards (S12, S13) */
.card { position:absolute; background:#0f0c0b; border:1px solid rgba(255,228,200,.14); border-radius:6px; box-shadow:0 30px 80px rgba(0,0,0,.55); }
.card .bar { height:58px; border-bottom:1px solid rgba(255,228,200,.12); display:flex; align-items:center; padding:0 28px; font-size:20px; letter-spacing:.16em; color:var(--muted); }
.frow { position:absolute; left:32px; right:32px; height:100px; border-bottom:1px solid rgba(255,228,200,.1); }
.frow .fl { position:absolute; left:0; top:20px; font-size:20px; letter-spacing:.16em; color:var(--muted); }
.frow .fv { position:absolute; left:0; top:52px; font-size:36px; color:var(--fg); white-space:nowrap; }
.frow .blank { position:absolute; left:0; top:84px; width:300px; height:2px; background:rgba(239,231,222,.3); }
.marks { position:absolute; inset:0; overflow:visible; pointer-events:none; }
.mark { fill:none; stroke:var(--amber); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }

/* S18 table, S21/22 fan */
.trow { position:absolute; left:120px; right:120px; height:120px; display:flex; align-items:center; }
.trow .ti { width:84px; height:84px; flex:none; }
.trow .tl { margin-left:40px; font-size:54px; font-weight:500; letter-spacing:-0.015em; }
.trow .tn { position:absolute; right:0; font-size:72px; font-weight:600; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }
.node { position:absolute; display:flex; align-items:center; gap:22px; white-space:nowrap; }
.node .ni { width:78px; height:78px; flex:none; }
.node .nl { font-size:56px; font-weight:500; letter-spacing:-0.015em; }
.bsub { position:absolute; font-family:"JetBrains Mono", monospace; font-size:32px; color:var(--muted); letter-spacing:.01em; white-space:nowrap; }
.conn { stroke:rgba(239,231,222,.4); stroke-width:2.5; fill:none; }
.dot { fill:var(--amber); }

#nav { position:fixed; right:18px; bottom:18px; display:flex; gap:8px; align-items:center; opacity:0; transition:opacity .4s; z-index:99; }
body.mouse #nav { opacity:1; }
#nav button { all:unset; cursor:pointer; width:44px; height:44px; border-radius:22px; display:grid; place-items:center; background:rgba(255,255,255,.1); color:#fff; font:500 20px/1 "Inter Tight", sans-serif; }
#nav button:hover { background:rgba(255,255,255,.2); }
#nav button:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
#pos { font:500 14px/1 "Inter Tight", sans-serif; color:rgba(255,255,255,.7); padding:0 8px; font-variant-numeric:tabular-nums; }
#jump { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); font:500 22px/1 "Inter Tight", sans-serif; color:#fff; background:rgba(0,0,0,.75); padding:10px 16px; border-radius:10px; z-index:99; }
{{SLIDE_CSS}}
</style>

<div id="stage">
  <canvas id="light" width="960" height="540"></canvas>
{{SLIDES}}
  <canvas id="grain" width="960" height="540"></canvas>
  <div id="logo">{{LOGO}}</div>
</div>
<div id="nav"><span id="pos"></span><button id="prev" aria-label="Back">‹</button><button id="replay" aria-label="Replay this slide">↺</button><button id="next" aria-label="Next">›</button></div>
<div id="jump" hidden></div>

<script>{{GSAP}}</script>
<script>
var NOTES = {{NOTES}};
var LIGHTS = {{LIGHTS}};
</script>
<script>
/* ---------- the light: warm dark, soft glow, stippled dots whose density follows the light ---------- */
var LIGHT = (function () {
  var W = 960, H = 540, cv = document.getElementById('light'), g = cv.getContext('2d');
  var img = g.createImageData(W, H), px = new Uint32Array(img.data.buffer);
  var base = new Float32Array(W * H), N = 1 << 20, MASK = N - 1, noise = new Float32Array(N);
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  for (var i = 0; i < N; i++) noise[i] = rnd();
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
    var dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2), d = dx * dx * 0.8 + dy * dy;
    base[y * W + x] = 0.105 * Math.max(0.25, 1 - 0.55 * d);
  }
  var sets = [];   // every slide's light list with its visibility
  var gx = [], gy = [];
  function frame(now) {
    var act = [];
    var breathe = 1 + 0.045 * Math.sin(now / 1300);
    sets.forEach(function (s) {
      if (s.vis.v <= 0.002) return;
      s.L.forEach(function (l) {
        var I = l.i * s.vis.v * breathe;
        if (I > 0.003 && l.r > 1) act.push({ x: l.x / 2, y: l.y / 2, rx: l.r / 2, ry: (l.ry || l.r) / 2, i: I });
      });
    });
    var n = act.length, k, x, y, x0, x1, row = new Float32Array(W);
    for (k = 0; k < n; k++) {   // each light only touches the columns and rows where it is visible
      var a = act[k], ax = gx[k] || (gx[k] = new Float32Array(W)), ay = gy[k] || (gy[k] = new Float32Array(H));
      a.x0 = Math.max(0, Math.floor(a.x - a.rx * 2.6)); a.x1 = Math.min(W, Math.ceil(a.x + a.rx * 2.6));
      for (x = a.x0; x < a.x1; x++) { var u = (x - a.x) / a.rx; ax[x] = Math.exp(-u * u); }
      for (y = 0; y < H; y++) { var v = (y - a.y) / a.ry; ay[y] = Math.exp(-v * v) * a.i; }
    }
    var off1 = (Math.floor(now / 90) * 2654435761) & MASK, off2 = (off1 * 7 + 99991) & MASK, i = 0;
    for (y = 0; y < H; y++) {
      row.fill(0);
      for (k = 0; k < n; k++) {
        var gyk = gy[k][y]; if (gyk < 0.004) continue;
        var gxk = gx[k]; x1 = act[k].x1;
        for (x = act[k].x0; x < x1; x++) row[x] += gxk[x] * gyk;
      }
      for (x = 0; x < W; x++, i++) {
        var L = row[x]; if (L > 1.6) L = 1.6;
        var nz = noise[(i + off1) & MASK], b = base[i] + (nz - 0.5) * 0.045, lit = 0;
        if (L > 0.004) {
          lit = L * L * 0.32 + L * 0.1;
          if (noise[(i * 3 + off2) & MASK] < L * 0.62) lit += 0.22 + 0.38 * nz * (L < 1 ? L : 1);
        }
        var r = (b + lit) * 255, gg = b * 222 + lit * 238, bb = b * 196 + lit * 214;
        px[i] = 0xff000000 | ((bb > 255 ? 255 : bb) << 16) | ((gg > 255 ? 255 : gg) << 8) | (r > 255 ? 255 : r);
      }
    }
    g.putImageData(img, 0, 0);
  }
  var last = 0;
  function loop(now) { if (now - last > 36) { last = now; frame(now); } requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  return { add: function (L) { var s = { L: L, vis: { v: 0 } }; sets.push(s); return s; } };
})();

/* film grain over everything, so the silhouettes and the type sit in the same grain as the light */
(function () {
  var cv = document.getElementById('grain'), g = cv.getContext('2d'), tiles = [], seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  for (var k = 0; k < 4; k++) { var t = g.createImageData(240, 135); for (var i = 0; i < t.data.length; i += 4) { var v = rnd() * 255; t.data[i] = v; t.data[i + 1] = v * 0.92; t.data[i + 2] = v * 0.84; t.data[i + 3] = rnd() < 0.5 ? 18 : 0; } tiles.push(t); }
  var last = -1;
  (function loop(now) {
    var f = Math.floor(now / 80);
    if (f !== last) { last = f; for (var ty = 0; ty < 4; ty++) for (var tx = 0; tx < 4; tx++) g.putImageData(tiles[(f + tx + ty * 3) % 4], tx * 240, ty * 135); }
    requestAnimationFrame(loop);
  })(0);
})();

/* ---------- motion helpers ---------- */
var M = {
  // text and small parts: rise 30px out of a blur
  fade: function (tl, t, at, o) { o = o || {}; tl.fromTo(t, { opacity: 0, y: o.y == null ? 30 : o.y, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: o.dur || 1.0, ease: 'expo.out', stagger: o.stagger || 0 }, at); return at + (o.dur || 1.0) + (o.stagger || 0) * ((t.length || 1) - 1); },
  // silhouettes: slow rise into place
  rise: function (tl, t, at, o) { o = o || {}; tl.fromTo(t, { opacity: 0, y: o.y == null ? 60 : o.y, scale: o.s || 0.97 }, { opacity: 1, y: 0, scale: 1, duration: o.dur || 1.8, ease: 'power3.out', stagger: o.stagger || 0 }, at); return at + (o.dur || 1.8); },
  out: function (tl, t, at, o) { o = o || {}; tl.to(t, { opacity: o.to || 0, y: o.y || 0, duration: o.dur || 0.7, ease: 'power2.inOut' }, at); return at + (o.dur || 0.7); },
  // a light opens from nothing to its resting size and strength
  bloom: function (tl, l, at, o) { o = o || {}; var to = { i: o.i == null ? l.i : o.i, r: o.r || l.r, duration: o.dur || 2.2, ease: o.ease || 'power2.out' }; if (l.ry) to.ry = o.ry || l.ry; var from = { i: 0, r: (o.r || l.r) * 0.45 }; if (l.ry) from.ry = (o.ry || l.ry) * 0.45; tl.fromTo(l, from, to, at); return at + to.duration; },
  light: function (tl, l, vars, at) { vars.duration = vars.duration || 1.4; vars.ease = vars.ease || 'power2.inOut'; tl.to(l, vars, at); return at + vars.duration; },
  pulse: function (tl, l, from, peak, at, dur) { dur = dur || 0.5; tl.fromTo(l, { i: from }, { i: peak, duration: dur, ease: 'sine.inOut', yoyo: true, repeat: 1, immediateRender: false }, at); return at + dur * 2; },
  typeOn: function (tl, line, at, dur) {
    var chars = line.querySelectorAll('.ch'), cur = line.querySelector('.cur'), step = dur / chars.length;
    tl.set(cur, { opacity: 1, x: chars[0].offsetLeft, y: chars[0].offsetTop }, at);
    chars.forEach(function (c, i) { tl.set(c, { opacity: 1 }, at + i * step); tl.set(cur, { x: c.offsetLeft + c.offsetWidth + 4, y: c.offsetTop }, at + i * step); });
    return at + dur;
  },
  count: function (tl, el, at, to, dur) { tl.fromTo(el, { innerText: 0 }, { innerText: to, snap: { innerText: 1 }, duration: dur || 1.6, ease: 'power2.out' }, at); return at + (dur || 1.6); },
  draw: function (tl, el, at, dur) {
    var len = el.getTotalLength();
    // opacity, not visibility: a visible child would show through its hidden slide
    tl.fromTo(el, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur || 1.0, ease: 'power2.inOut' }, at);
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at);
    return at + (dur || 1.0);
  },
  hide: function (tl, t) { tl.set(t, { opacity: 0 }, 0); }
};
var BUILDERS = {};
</script>
<script>
{{BUILDERS}}
</script>
<script>
/* ---------- deck engine: each click plays the slide's timeline up to its next hold ---------- */
(function () {
  var stage = document.getElementById('stage');
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var decks = [], cur = -1, k = 0, tw = null, busy = false;
  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  function endOf(d, i) { return i < d.holds.length ? d.holds[i] : d.tl.duration(); }
  function startOf(d, i) { return i === 0 ? 0 : d.holds[i - 1]; }
  function playStep(i) {
    var d = decks[cur]; if (tw) tw.kill();
    d.tl.pause().seek(startOf(d, i), true);
    tw = d.tl.tweenFromTo(startOf(d, i), endOf(d, i), { ease: 'none' });
    k = i; status();
  }
  function settle(i) { var d = decks[cur]; if (tw) { tw.kill(); tw = null; } d.tl.pause().seek(endOf(d, i), true); k = i; status(); }
  function lightTo(d, v, dur) { gsap.killTweensOf(d.ls.vis); gsap.to(d.ls.vis, { v: v, duration: dur, ease: 'sine.inOut' }); }
  function show(i, atEnd, quick) {
    var d = decks[i];
    gsap.set(d.exit, { clearProps: 'opacity,transform,filter' });
    d.el.style.visibility = 'visible'; cur = i;
    lightTo(d, 1, quick ? 0.01 : 0.9);
    if (atEnd) settle(d.holds.length); else playStep(0);
    try { history.replaceState(null, '', '#s' + String(i + 1).padStart(2, '0')); } catch (e) {}
  }
  function hide(d, dur) { d.el.style.visibility = 'hidden'; lightTo(d, 0, dur == null ? 0.6 : dur); }
  function jump(i, atEnd) { if (tw) { tw.kill(); tw = null; } busy = false; if (decks[cur]) hide(decks[cur], 0.4); cur = -1; show(i, atEnd); }

  function go(i, atEnd) {
    if (i < 0 || i >= decks.length || busy) return;
    var from = decks[cur]; if (tw) { tw.kill(); tw = null; }
    if (i === cur + 1 && from.keep) { hide(from, 0.01); show(i, atEnd, true); return; }   // S20 → S21 → S22 carry the same picture across
    if (i < cur) { hide(from, 0.3); show(i, atEnd); return; }
    busy = true;
    lightTo(from, 0, 0.9);
    gsap.to(from.exit, { opacity: 0, y: -14, filter: 'blur(8px)', duration: 0.7, ease: 'power2.in', onComplete: function () {
      from.el.style.visibility = 'hidden'; busy = false; show(i, atEnd);
    } });
  }
  function next() { if (busy) return; var d = decks[cur]; if (tw && tw.isActive()) { settle(k); return; } if (k < d.holds.length) playStep(k + 1); else go(cur + 1); }
  function prev() { if (busy) return; if (tw && tw.isActive()) { settle(k); return; } if (k > 0) settle(k - 1); else go(cur - 1, true); }

  // presenter notes in a second window (press N)
  var notesWin = null;
  function paintNotes() {
    if (!notesWin || notesWin.closed) return;
    var doc = notesWin.document, id = decks[cur].el.id;
    doc.getElementById('h').textContent = 'SLIDE ' + id.slice(1) + '  ·  BUILD ' + (k + 1) + ' OF ' + (decks[cur].holds.length + 1);
    doc.getElementById('b').textContent = NOTES[id] || '';
    doc.getElementById('n').textContent = decks[cur + 1] ? 'Next: slide ' + decks[cur + 1].el.id.slice(1) : 'Last slide';
  }
  function openNotes() {
    try {
      notesWin = window.open('', 'elevate-notes', 'width=620,height=760'); if (!notesWin) return;
      notesWin.document.title = 'Speaker notes';
      notesWin.document.body.innerHTML = '<div id="h" style="font:600 15px/1.3 Helvetica,Arial;letter-spacing:2px;color:#EA9458"></div>' +
        '<div id="b" style="font:400 24px/1.5 Helvetica,Arial;color:#EFE7DE;margin-top:18px;white-space:pre-wrap"></div>' +
        '<div id="n" style="font:400 15px/1.4 Helvetica,Arial;color:#9C938A;margin-top:26px"></div>';
      notesWin.document.body.style.cssText = 'margin:0;padding:30px;background:#14110f';
      notesWin.addEventListener('keydown', onKey); paintNotes();
    } catch (e) {}
  }
  function status() { var d = decks[cur]; document.getElementById('pos').textContent = d.el.id.slice(1) + ' · ' + (k + 1) + '/' + (d.holds.length + 1); paintNotes(); }

  var buf = '', bufTimer, jumpEl = document.getElementById('jump');
  function onKey(e) {
    if (/^[0-9]$/.test(e.key)) { buf += e.key; jumpEl.hidden = false; jumpEl.textContent = 'Go to slide ' + buf; clearTimeout(bufTimer); bufTimer = setTimeout(function () { buf = ''; jumpEl.hidden = true; }, 2500); return; }
    if (e.key === 'Enter' && buf) { var n = +buf; buf = ''; jumpEl.hidden = true; if (n >= 1 && n <= decks.length) jump(n - 1); return; }
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') jump(0);
    else if (e.key === 'End') jump(decks.length - 1, true);
    else if (e.key === 'r' || e.key === 'R') jump(cur);
    else if (e.key === 'n' || e.key === 'N') openNotes();
    else if (e.key === 'f' || e.key === 'F') { var doc = document; (doc.fullscreenElement ? doc.exitFullscreen() : doc.documentElement.requestFullscreen()).catch(function () {}); }
  }
  addEventListener('keydown', onKey);
  document.addEventListener('click', function (e) { if (e.target.closest('#nav')) return; if (e.clientX < innerWidth * 0.2) prev(); else next(); });
  document.getElementById('next').onclick = function (e) { e.stopPropagation(); next(); };
  document.getElementById('prev').onclick = function (e) { e.stopPropagation(); prev(); };
  document.getElementById('replay').onclick = function (e) { e.stopPropagation(); jump(cur); };
  var idle; addEventListener('mousemove', function () { document.body.classList.add('mouse'); clearTimeout(idle); idle = setTimeout(function () { document.body.classList.remove('mouse'); }, 1800); });

  document.fonts.ready.then(function () {
    slides.forEach(function (el) {
      var tl = gsap.timeline({ paused: true }), holds = [];
      var L = (LIGHTS[el.id] || []).map(function (a) { var o = { x: a[0], y: a[1], r: a[2], i: a[3] }; if (a[4]) o.ry = a[4]; return o; });
      var ls = LIGHT.add(L);
      BUILDERS[el.id](el, tl, function (t) { holds.push(t); }, L);
      decks.push({ el: el, tl: tl, holds: holds, ls: ls, keep: el.dataset.keep === '1', exit: el.querySelector('.exit') });
    });
    gsap.fromTo('#logo', { opacity: 0 }, { opacity: 0.92, duration: 1.4, delay: 0.3 });
    var m = location.hash.match(/^#s(\d+)$/), start = m ? Math.min(decks.length, Math.max(1, +m[1])) - 1 : 0;
    show(start);
    window.__deck = { next: next, prev: prev, go: jump, state: function () { return { slide: cur + 1, build: k + 1, builds: decks[cur].holds.length + 1, busy: busy, playing: !!(tw && tw.isActive()) }; } };
  });
})();
