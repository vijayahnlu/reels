<title>ELEVATE IGP 2026 Demo</title>
<style>
/* Layout: 1920x1080 stage scaled to the window. One clear illustration per thought, printed in fine horizontal
   lines on black, with film grain. Orange marks only the thing the sentence is about. */
@font-face { font-family:"Inter Tight"; font-weight:400; src:url(data:font/woff2;base64,{{FONT_400}}) format("woff2"); }
@font-face { font-family:"Inter Tight"; font-weight:500; src:url(data:font/woff2;base64,{{FONT_500}}) format("woff2"); }
@font-face { font-family:"Inter Tight"; font-weight:600; src:url(data:font/woff2;base64,{{FONT_600}}) format("woff2"); }
@font-face { font-family:"JetBrains Mono"; font-weight:400; src:url(data:font/woff2;base64,{{MONO_400}}) format("woff2"); }
@font-face { font-family:"JetBrains Mono"; font-weight:500; src:url(data:font/woff2;base64,{{MONO_500}}) format("woff2"); }
:root { --bg:#0A0A0A; --fg:#F2F0EC; --grey:#8A8780; --paper:#E9E6E0; --ink:#121212; --accent:#C8642A; color-scheme:dark; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); overflow:hidden; }
body { color:var(--fg); font-family:"Inter Tight", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing:antialiased; user-select:none; }
#stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:center; overflow:hidden; background:var(--bg); }
#grain { position:absolute; inset:0; pointer-events:none; z-index:50; mix-blend-mode:screen; }
#logo { position:absolute; left:120px; top:56px; width:310px; color:var(--fg); z-index:40; }
#logo svg { display:block; width:100%; height:auto; }
.slide { position:absolute; inset:0; visibility:hidden; }
.exit { position:absolute; inset:0; transform-origin:50% 50%; }
.mono { font-family:"JetBrains Mono", ui-monospace, monospace; }
/* illustrations: silhouette printed in lines, crisp edges */
.ill { position:absolute; overflow:visible; }
.ill .ink { fill:url(#print); }
.ill .solid { fill:var(--fg); }
.ill .acc { fill:url(#printAcc); }
.cap { position:absolute; font-size:24px; letter-spacing:.16em; color:var(--grey); text-transform:uppercase; white-space:nowrap; }
.cap b { color:var(--accent); font-weight:500; }
.scene { position:absolute; inset:0; }
/* typed questions */
.qs { position:absolute; left:120px; right:80px; bottom:96px; display:flex; flex-direction:column; gap:22px; font-size:66px; font-weight:400; letter-spacing:-0.015em; line-height:1.15; }
.ty { position:relative; white-space:nowrap; }
.ch { opacity:0; }
.cur { position:absolute; left:0; top:0.12em; width:5px; height:1em; opacity:0; }
.cur::after { content:""; position:absolute; inset:0; background:var(--accent); animation:blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
.big { position:absolute; left:120px; bottom:110px; font-size:150px; font-weight:600; letter-spacing:-0.035em; line-height:0.98; }
.big .w, .stmt .w { display:inline-block; }
.stmt { position:absolute; left:120px; bottom:110px; width:860px; font-size:96px; font-weight:600; letter-spacing:-0.03em; line-height:1.04; }
/* S02 words inside the person */
.wordfill { font-family:"JetBrains Mono", monospace; font-size:10px; fill:var(--fg); }
.wordfill .hl { fill:var(--accent); }
/* S12 form */
.doc { position:absolute; left:1060px; top:230px; width:700px; height:760px; background:var(--paper); color:var(--ink); transform-origin:50% 0; }
.doc .bar { height:44px; background:#cfcac2; display:flex; align-items:center; padding:0 20px; font-size:17px; letter-spacing:.12em; color:#333; }
.doc .row { position:absolute; left:48px; right:48px; height:116px; border-bottom:1px solid #c9c4bb; }
.doc .lab { position:absolute; left:0; top:24px; font-size:20px; letter-spacing:.14em; color:#6b665e; }
.doc .val { position:absolute; left:0; top:56px; height:30px; background:#2a2a2a; }
.doc .txt { position:absolute; left:0; top:46px; font-size:46px; font-weight:500; color:var(--ink); }
.marks { position:absolute; inset:0; overflow:visible; pointer-events:none; }
.mark { fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
#nav { position:fixed; right:18px; bottom:18px; display:flex; gap:8px; align-items:center; opacity:0; transition:opacity .4s; z-index:99; }
body.mouse #nav { opacity:1; }
#nav button { all:unset; cursor:pointer; width:44px; height:44px; border-radius:22px; display:grid; place-items:center; background:rgba(255,255,255,.1); color:#fff; font:500 20px/1 "Inter Tight", sans-serif; }
#nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
#pos { font:500 14px/1 "Inter Tight", sans-serif; color:rgba(255,255,255,.7); padding:0 8px; }
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="print" width="6" height="7" patternUnits="userSpaceOnUse"><rect width="6" height="4.6" fill="#F2F0EC"/></pattern>
    <pattern id="printAcc" width="6" height="7" patternUnits="userSpaceOnUse"><rect width="6" height="4.6" fill="#C8642A"/></pattern>
  </defs>
</svg>

<div id="stage">
  <!-- S01 · one picture per question, drawn above the questions -->
  <section class="slide" id="s01"><div class="exit">
    <div class="scene" id="q0">
      <svg class="ill" style="left:900px;top:170px;width:450px;height:450px" viewBox="0 0 512 512"><g class="ink">{{ICON:meditation}}</g></svg>
      <svg class="ill pin" style="left:1450px;top:110px;width:240px;height:240px" viewBox="0 0 512 512"><g class="acc">{{ICON:position-marker}}</g></svg>
      <div class="cap mono" style="left:1420px;top:380px;line-height:1.7">Bihar School of Yoga<br><b>where?</b></div>
    </div>
    <div class="scene" id="q1">
      <svg class="ill" style="left:960px;top:200px;width:620px;height:500px" viewBox="0 40 512 412"><g class="ink">{{ICON:person-in-bed}}</g></svg>
      <svg class="ill moon" style="left:1500px;top:90px;width:260px;height:260px" viewBox="0 0 512 512"><g class="acc">{{ICON:night-sleep}}</g></svg>
      <div class="cap mono" style="left:960px;top:150px">Yoga Nidra</div>
    </div>
    <div class="scene" id="q2">
      <svg class="ill rays" style="left:1085px;top:85px;width:600px;height:600px;overflow:visible" viewBox="-300 -300 600 600"><circle class="halo" r="285" fill="none" stroke="#C8642A" stroke-width="2" stroke-dasharray="3 9"/><circle class="halo" r="245" fill="none" stroke="#F2F0EC" stroke-opacity=".35" stroke-width="2"/><circle class="halo" r="205" fill="none" stroke="#F2F0EC" stroke-opacity=".18" stroke-width="2"/></svg>
      <svg class="ill" style="left:1150px;top:150px;width:470px;height:470px" viewBox="0 0 512 512"><g class="ink">{{ICON:meditation}}</g></svg>
      <svg class="ill chainL" style="left:960px;top:300px;width:220px;height:220px" viewBox="0 0 512 512"><g class="acc">{{ICON:breaking-chain}}</g></svg>
      <svg class="ill chainR" style="left:1600px;top:300px;width:220px;height:220px;transform:scaleX(-1)" viewBox="0 0 512 512"><g class="acc">{{ICON:breaking-chain}}</g></svg>
      <div class="cap mono" style="left:1240px;top:650px">Moksha <b>· accept?</b></div>
    </div>
    <div class="qs">
      <div class="ty">{{Q1}}<span class="cur"></span></div>
      <div class="ty">{{Q2}}<span class="cur"></span></div>
      <div class="ty">{{Q3}}<span class="cur"></span></div>
    </div>
  </div></section>

  <!-- S02 · a person made of the entries on their own form -->
  <section class="slide" id="s02"><div class="exit">
    <svg class="ill" id="person" style="left:1080px;top:70px;width:1010px;height:1010px" viewBox="0 0 512 512">
      <defs><clipPath id="personClip">{{ICON:person}}</clipPath></defs>
      <g class="ink" style="opacity:.13">{{ICON:person}}</g>
      <g clip-path="url(#personClip)">{{WORDFILL}}</g>
    </svg>
    <div class="cap mono" style="left:120px;top:190px;line-height:1.9">same books · same current affairs · same questions<br><b>then the syllabus becomes you</b></div>
    <div class="big">{{BIG}}</div>
  </div></section>

  <!-- S12 · the board has read your form before you walk in -->
  <section class="slide" id="s12"><div class="exit">
    <svg class="ill" id="board" style="left:1250px;top:40px;width:330px;height:220px" viewBox="0 60 512 340"><g class="ink">{{ICON:round-table}}</g></svg>
    <div class="doc" id="doc">
      <div class="bar mono">DETAILED APPLICATION FORM</div>
      <div class="row" style="top:70px"><span class="lab mono">DISTRICT</span><span class="val" style="width:260px"></span></div>
      <div class="row" style="top:186px"><span class="lab mono">DEGREE</span><span class="val" style="width:380px"></span></div>
      <div class="row" style="top:302px"><span class="lab mono">EMPLOYER</span><span class="val" style="width:320px"></span></div>
      <div class="row" style="top:418px"><span class="lab mono">HOBBIES</span><span class="txt">Hatha yoga</span></div>
      <div class="row" style="top:534px;border:0"><span class="lab mono">PRIZES</span><span class="val" style="width:220px"></span></div>
      <svg class="marks" viewBox="0 0 700 760">
        <path class="mark" d="M44 154 C140 160 240 152 330 158"/>
        <path class="mark" d="M470 252 L496 280 L548 218"/>
        <path class="mark" d="M300 484 C300 444 200 436 120 440 C40 444 28 482 40 508 C56 540 180 544 268 536 C330 530 352 504 330 476"/>
      </svg>
    </div>
    <svg class="ill" id="lens" style="left:1180px;top:300px;width:300px;height:300px" viewBox="0 0 512 512"><g class="solid">{{ICON:magnifying-glass}}</g></svg>
    <div class="stmt">{{STMT}}</div>
  </div></section>

  <canvas id="grain" width="960" height="540" style="width:1920px;height:1080px"></canvas>
</div>
<div id="nav"><span id="pos"></span><button id="prev" aria-label="Back">‹</button><button id="next" aria-label="Next">›</button></div>
<div id="logo-src" hidden>{{LOGO}}</div>

<script>{{GSAP}}</script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();
  var logo = document.createElement('div'); logo.id = 'logo'; logo.innerHTML = document.getElementById('logo-src').innerHTML; stage.appendChild(logo);

  /* film grain and drifting dust */
  function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  var gcv = document.getElementById('grain'), g = gcv.getContext('2d'), tiles = [], r0 = rng(11);
  for (var k = 0; k < 4; k++) { var t = g.createImageData(240, 135); for (var i = 0; i < t.data.length; i += 4) { var v = r0() * 255; t.data[i] = t.data[i + 1] = t.data[i + 2] = v; t.data[i + 3] = r0() < 0.5 ? 24 : 0; } tiles.push(t); }
  var dust = []; for (var d = 0; d < 70; d++) dust.push({ x: r0() * 960, y: r0() * 540, s: 0.4 + r0() * 1.2, v: 0.05 + r0() * 0.2 });
  (function loop(now) {
    var f0 = Math.floor(now / 60);
    for (var ty = 0; ty < 4; ty++) for (var tx = 0; tx < 4; tx++) g.putImageData(tiles[(f0 + tx + ty * 3) % 4], tx * 240, ty * 135);
    g.fillStyle = '#fff'; g.globalAlpha = 0.35;
    dust.forEach(function (p) { p.y -= p.v; if (p.y < 0) p.y = 540; g.fillRect(p.x, p.y, p.s, p.s); }); g.globalAlpha = 1;
    requestAnimationFrame(loop);
  })(0);

  /* ---------- helpers ---------- */
  function fadeUp(tl, t, at, o) { o = o || {}; tl.fromTo(t, { opacity: 0, y: o.y == null ? 30 : o.y, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: o.dur || 0.9, ease: 'expo.out', stagger: o.stagger || 0 }, at); }
  function typeOn(tl, line, at, dur) {
    var chars = line.querySelectorAll('.ch'), cur = line.querySelector('.cur'), step = dur / chars.length;
    tl.set(cur, { opacity: 1, x: chars[0].offsetLeft }, at);
    chars.forEach(function (c, i) { tl.set(c, { opacity: 1 }, at + i * step); tl.set(cur, { x: c.offsetLeft + c.offsetWidth + 4 }, at + i * step); });
    return at + dur;
  }
  function draw(tl, el, at, dur) {
    var len = el.getTotalLength();
    tl.fromTo(el, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur || 1.0, ease: 'power2.inOut' }, at);
    tl.fromTo(el, { visibility: 'hidden' }, { visibility: 'visible', duration: 0.01 }, at);
  }
  // an illustration prints in from top to bottom, with a short scan flicker
  function printIn(tl, el, at, dur) {
    dur = dur || 1.1;
    tl.fromTo(el, { clipPath: 'inset(0% 0% 100% 0%)', opacity: 1 }, { clipPath: 'inset(0% 0% 0% 0%)', duration: dur, ease: 'power2.inOut' }, at);
    tl.fromTo(el, { x: -14 }, { x: 0, duration: 0.06, repeat: 5, yoyo: true, ease: 'steps(1)' }, at + dur * 0.4);
  }
  // the previous picture switches off like a CRT
  function switchOff(tl, el, at) {
    tl.to(el, { scaleY: 0.01, scaleX: 1.05, transformOrigin: '50% 50%', filter: 'brightness(2.5)', duration: 0.22, ease: 'power3.in' }, at)
      .to(el, { scaleX: 0, opacity: 0, duration: 0.12, ease: 'power2.in' }, at + 0.22);
  }

  var B = {
    s01: function (root, tl, P) {
      var sc = [root.querySelector('#q0'), root.querySelector('#q1'), root.querySelector('#q2')];
      var qs = root.querySelectorAll('.ty'), t = 0.2;
      sc.forEach(function (s) { tl.set(s, { opacity: 0 }, 0); });
      qs.forEach(function (ln, i) {
        if (i > 0) { P(t); t += 0.05; tl.set(qs[i - 1].querySelector('.cur'), { opacity: 0 }, t); switchOff(tl, sc[i - 1], t); t += 0.3; }
        var s = sc[i];
        tl.set(s, { opacity: 1, scaleX: 1, scaleY: 1, filter: 'none' }, t);
        var ills = s.querySelectorAll('.ill');
        ills.forEach(function (el, j) { printIn(tl, el, t + j * 0.25, 1.0); });
        if (i === 0) tl.fromTo(s.querySelector('.pin'), { y: -260 }, { y: 0, duration: 1.0, ease: 'bounce.out' }, t + 0.5);
        if (i === 1) tl.fromTo(s.querySelector('.moon'), { y: 20, rotation: -12 }, { y: 0, rotation: 0, duration: 1.4, ease: 'elastic.out(1, 0.5)' }, t + 0.4);
        if (i === 2) {   // the chains snap apart, the rays open behind
          tl.fromTo(s.querySelector('.rays'), { scale: 0.5, rotation: -40 }, { scale: 1, rotation: 0, duration: 1.8, ease: 'expo.out' }, t);
          tl.fromTo(s.querySelector('.chainL'), { x: 120 }, { x: -40, rotation: -14, duration: 0.9, ease: 'back.out(3)' }, t + 1.0);
          tl.fromTo(s.querySelector('.chainR'), { x: -120 }, { x: 40, rotation: 14, duration: 0.9, ease: 'back.out(3)' }, t + 1.0);
        }
        fadeUp(tl, s.querySelector('.cap'), t + 0.8, { y: 12 });
        t = Math.max(typeOn(tl, ln, t + 0.15, 1.3), t + 1.9);
      });
    },
    s02: function (root, tl) {
      fadeUp(tl, root.querySelector('.cap'), 0.1, { y: 12 });
      printIn(tl, root.querySelector('#person'), 0.2, 1.2);
      var lines = root.querySelectorAll('.wf');
      tl.fromTo(lines, { opacity: 0 }, { opacity: 1, duration: 0.18, stagger: { each: 0.045, from: 'end' } }, 0.6);
      fadeUp(tl, root.querySelectorAll('.big .w'), 2.3, { stagger: 0.09, dur: 1.0, y: 40 });
    },
    s12: function (root, tl, P) {
      var doc = root.querySelector('#doc'), lens = root.querySelector('#lens');
      printIn(tl, root.querySelector('#board'), 0.1, 0.9);
      tl.fromTo(doc, { y: -800, rotation: 0 }, { y: 0, rotation: -2, duration: 1.2, ease: 'expo.out' }, 0.3);
      fadeUp(tl, root.querySelectorAll('.stmt .w'), 0.7, { stagger: 0.06 });
      tl.set(lens, { opacity: 0 }, 0);
      P(2.0);
      // the lens reads the form line by line, stopping on what it marks
      tl.fromTo(lens, { opacity: 0, x: -60, y: -60 }, { opacity: 1, x: 0, y: 0, duration: 0.5, ease: 'power2.out' }, 2.05);
      tl.to(lens, { x: 140, y: 110, duration: 0.7, ease: 'power2.inOut' }, 2.5);
      var marks = root.querySelectorAll('.mark');
      draw(tl, marks[0], 3.0, 0.5);
      tl.to(lens, { x: 360, y: 210, duration: 0.6, ease: 'power2.inOut' }, 3.3);
      draw(tl, marks[1], 3.8, 0.4);
      tl.to(lens, { x: 60, y: 440, duration: 0.8, ease: 'power2.inOut' }, 4.1);
      draw(tl, marks[2], 4.8, 0.8);
      tl.to(lens, { x: 520, y: 640, opacity: 0, duration: 0.7, ease: 'power2.in' }, 5.7);
    }
  };

  /* ---------- deck engine: each click scrubs the slide's timeline to its next hold ---------- */
  var slides = [].slice.call(document.querySelectorAll('.slide')), decks = [], cur = -1, k = 0, tw = null, busy = false;
  function endOf(d, i) { return i < d.holds.length ? d.holds[i] : d.tl.duration(); }
  function startOf(d, i) { return i === 0 ? 0 : d.holds[i - 1]; }
  function playStep(i) { var d = decks[cur]; if (tw) tw.kill(); d.tl.pause().seek(startOf(d, i), true); tw = d.tl.tweenFromTo(startOf(d, i), endOf(d, i), { ease: 'none' }); k = i; status(); }
  function settle(i) { var d = decks[cur]; if (tw) { tw.kill(); tw = null; } d.tl.pause().seek(endOf(d, i), true); k = i; status(); }
  function show(i, atEnd) { var d = decks[i]; gsap.set(d.exit, { clearProps: 'opacity,transform,filter' }); d.el.style.visibility = 'visible'; cur = i; if (atEnd) settle(d.holds.length); else playStep(0); }
  function go(i, atEnd) {
    if (i < 0 || i >= decks.length || busy) return;
    var from = decks[cur]; if (tw) { tw.kill(); tw = null; }
    if (i < cur) { from.el.style.visibility = 'hidden'; show(i, atEnd); return; }
    busy = true;
    gsap.timeline({ onComplete: function () { from.el.style.visibility = 'hidden'; busy = false; show(i, atEnd); } })
      .to(from.exit, { scaleY: 0.004, scaleX: 1.04, filter: 'brightness(2.2)', duration: 0.28, ease: 'power3.in' })
      .to(from.exit, { scaleX: 0, opacity: 0, duration: 0.16, ease: 'power2.in' });
  }
  function next() { if (busy) return; var d = decks[cur]; if (tw && tw.isActive()) { settle(k); return; } if (k < d.holds.length) playStep(k + 1); else go(cur + 1); }
  function prev() { if (busy) return; if (tw && tw.isActive()) { settle(k); return; } if (k > 0) settle(k - 1); else go(cur - 1, true); }
  function status() { document.getElementById('pos').textContent = decks[cur].el.id.slice(1) + ' · ' + (k + 1) + '/' + (decks[cur].holds.length + 1); }
  addEventListener('keydown', function (e) {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { e.preventDefault(); prev(); }
    else if (e.key === 'f' || e.key === 'F') { var doc = document; (doc.fullscreenElement ? doc.exitFullscreen() : doc.documentElement.requestFullscreen()).catch(function () {}); }
  });
  document.addEventListener('click', function (e) { if (e.target.closest('#nav')) return; if (e.clientX < innerWidth * 0.2) prev(); else next(); });
  document.getElementById('next').onclick = function (e) { e.stopPropagation(); next(); };
  document.getElementById('prev').onclick = function (e) { e.stopPropagation(); prev(); };
  var idle; addEventListener('mousemove', function () { document.body.classList.add('mouse'); clearTimeout(idle); idle = setTimeout(function () { document.body.classList.remove('mouse'); }, 1800); });

  document.fonts.ready.then(function () {
    slides.forEach(function (el) {
      var tl = gsap.timeline({ paused: true }), holds = [];
      B[el.id](el, tl, function (t) { holds.push(t); });
      decks.push({ el: el, tl: tl, holds: holds, exit: el.querySelector('.exit') });
    });
    gsap.fromTo(logo, { opacity: 0 }, { opacity: 1, duration: 1.2, delay: 0.2 });
    show(0);
    window.__deck = { next: next, prev: prev, state: function () { return { slide: cur, build: k, builds: decks[cur].holds.length + 1 }; } };
  });
})();
</script>
